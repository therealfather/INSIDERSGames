<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Sector Rot — iNSIDERS Games</title>
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="game" data-game="sector-rot" data-depth="1">
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html" aria-label="iNSIDERS Games home"><img data-studio-logo src="../assets/images/branding/insiders-corporation-logo.png" alt="iNSIDERS Games"></a>
      <nav class="nav" aria-label="Primary"></nav>
      <a class="header-cta" href="#" hidden></a>
      <button class="menu-toggle" aria-expanded="false">Menu</button>
    </div>
    <nav class="mobile-menu" aria-label="Mobile"></nav>
  </header>

  <div class="game-subnav-shell" data-game-subnav-shell>
    <div class="wrap game-subnav">
      <a class="game-subnav-brand" href="#top" data-game-subnav-brand></a>
      <nav data-game-subnav aria-label="Game navigation"></nav>
    </div>
  </div>

  <main id="content">
    <section class="game-hero game-hero-v2" id="top">
      <div class="game-hero-bg" data-game-hero></div>
      <div class="game-hero-overlay"></div>
      <div class="wrap game-hero-grid">
        <div class="game-hero-content">
          <div class="game-kicker" data-game-kicker></div>
          <img class="game-logo" data-game-logo hidden>
          <h1 class="game-title-text" data-game-title></h1>
          <div class="game-hero-tags" data-game-hero-tags></div>
          <div class="game-hero-summary" data-game-short></div>
          <div class="actions game-primary-actions" data-game-cta></div>
        </div>
        <aside class="game-hero-panel" data-game-hero-panel>
          <div class="panel-label" data-label-project-info></div>
          <dl class="game-quick-facts" data-game-quick-facts></dl>
          <div class="quick-store-list" data-game-quick-stores></div>
        </aside>
      </div>
    </section>

    <section class="game-section game-trailer-section" id="trailer" data-trailer-section>
      <div class="wrap">
        <div class="section-bar">
          <div><div><div class="eyebrow" data-trailer-eyebrow></div><h2 data-trailer-title></h2></div></div>
          <a class="section-anchor" href="#buy" data-label-trailer-get-game></a>
        </div>
        <div class="trailer-layout">
          <div class="video-shell" data-trailer></div>
          <div class="trailer-copy" data-trailer-copy></div>
        </div>
        <div class="media-empty" data-trailer-empty hidden></div>
      </div>
    </section>

    <section class="game-section game-store-section" id="buy" data-store-section>
      <div class="wrap">
        <div class="section-bar">
          <div><div><div class="eyebrow" data-label-stores-eyebrow></div><h2 data-store-title></h2></div></div>
          <p class="section-note" data-store-intro></p>
        </div>
        <div class="storefront-grid-v2" data-storefronts></div>
      </div>
    </section>

    <section class="game-section game-about-section" id="overview">
      <div class="wrap game-content-v2">
        <article class="game-copy reveal">
          <div class="section-bar compact">
            <div><div><div class="eyebrow" data-about-eyebrow></div><h2 data-about-title></h2></div></div>
          </div>
          <div class="game-description" data-game-description></div>
          <div class="feature-grid" data-game-features></div>
        </article>
        <aside class="game-facts reveal" data-game-facts-panel>
          <div class="panel-label" data-label-game-file></div>
          <dl data-game-facts></dl>
          <div class="game-facts-actions" data-game-facts-actions></div>
        </aside>
      </div>
    </section>

    <section class="game-section game-custom-section" id="details" data-game-custom-section hidden>
      <div class="wrap">
        <div class="section-bar"><div><div><div class="eyebrow" data-label-custom-eyebrow></div><h2 data-label-custom-title></h2></div></div></div>
        <article class="article-content game-custom-content" data-game-blocks></article>
      </div>
    </section>

    <section class="game-section roadmap-section" id="roadmap" data-roadmap-section hidden>
      <div class="wrap">
        <div class="section-bar"><div><div><div class="eyebrow" data-roadmap-eyebrow></div><h2 data-roadmap-title></h2></div></div><p class="section-note" data-roadmap-intro></p></div>
        <div class="roadmap-media" data-roadmap-media></div>
      </div>
    </section>

    <section class="game-section updates-section" id="updates" data-updates-section hidden>
      <div class="wrap">
        <div class="section-bar"><div><div><div class="eyebrow" data-updates-eyebrow></div><h2 data-updates-title></h2></div></div><p class="section-note" data-updates-intro></p></div>
        <div class="updates-list" data-updates-list></div>
      </div>
    </section>

    <section class="game-section media-section" id="screenshots" data-gallery-section>
      <div class="wrap">
        <div class="section-bar"><div><div><div class="eyebrow" data-gallery-eyebrow></div><h2 data-gallery-title></h2></div></div><p class="section-note" data-label-gallery-note></p></div>
        <div class="gallery gallery-v2" data-gallery></div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>
  <script src="../assets/data/site-data.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
